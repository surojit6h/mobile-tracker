name: Build Android APK

# Builds the release APK in the cloud. No local Flutter needed.
# Runs on every push to main, and can be triggered manually from the
# GitHub "Actions" tab (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java (needed by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # The repo contains lib/, pubspec.yaml and custom native Android
      # files (Manifest, MainApplication, MainActivity, drawables).
      # We back them up, let `flutter create` generate the native scaffolding,
      # then restore our custom files on top.
      - name: Back up custom files
        working-directory: app
        run: |
          mkdir -p ../_backup
          cp pubspec.yaml ../_backup/pubspec.yaml
          if [ -d android ]; then
            cp -r android ../_backup/android
          fi

      - name: Generate native project scaffolding
        working-directory: app
        run: flutter create . --platforms=android --project-name mobiletracker --org com.surojitsen

      - name: Restore custom files
        working-directory: app
        run: |
          cp ../_backup/pubspec.yaml pubspec.yaml
          if [ -d ../_backup/android ]; then
            cp -r ../_backup/android/* android/
          fi

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Set up Keystore
        working-directory: app/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding upload keystore from repository secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            cat <<EOF > key.properties
storePassword=${{ secrets.KEYSTORE_PASSWORD }}
keyPassword=${{ secrets.KEY_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
storeFile=upload-keystore.jks
EOF
            python3 ../../.github/scripts/configure-signing.py .
          fi

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-tracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
