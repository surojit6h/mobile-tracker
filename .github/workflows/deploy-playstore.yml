name: Deploy to Google Play Store

# Builds a signed Android App Bundle (.aab) and deploys it to Google Play Console.
# Can be run manually anytime via the GitHub "Actions" tab (workflow_dispatch)
# or triggered automatically by pushing a version tag (e.g., v1.0.1).

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play release track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status"
        required: true
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - inProgress
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # Back up our custom native Android files
      - name: Back up custom files
        working-directory: app
        run: |
          mkdir -p ../_backup
          cp pubspec.yaml ../_backup/pubspec.yaml
          if [ -d android ]; then
            cp -r android ../_backup/android
          fi

      # Generate scaffolding with our production package name
      - name: Generate native project scaffolding
        working-directory: app
        run: flutter create . --platforms=android --project-name mobiletracker --org com.surojitsen

      # Restore our custom native files on top
      - name: Restore custom files
        working-directory: app
        run: |
          cp ../_backup/pubspec.yaml pubspec.yaml
          if [ -d ../_backup/android ]; then
            cp -r ../_backup/android/* android/
          fi

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: app
        run: dart run flutter_launcher_icons

      # Prepare Release Keystore for signing
      - name: Set up Keystore
        id: keystore
        working-directory: app/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding upload keystore from repository secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT

            # Configure key.properties
            cat <<EOF > key.properties
storePassword=${{ secrets.KEYSTORE_PASSWORD }}
keyPassword=${{ secrets.KEY_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
storeFile=upload-keystore.jks
EOF

            # Configure Gradle signing
            python3 ../../.github/scripts/configure-signing.py .
          else
            echo "No KEYSTORE_BASE64 secret provided. AAB will be built without custom signing."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # Build Android App Bundle (.aab)
      - name: Build Release App Bundle (.aab)
        working-directory: app
        run: flutter build appbundle --release

      # Also build Release APK for direct downloading
      - name: Build Release APK (.apk)
        working-directory: app
        run: flutter build apk --release

      # Save artifacts in GitHub Actions tab
      - name: Archive Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Archive Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Deploy directly to Google Play Store via Google Play Developer API
      - name: Deploy to Google Play Console
        if: ${{ env.PLAY_KEY != '' }}
        env:
          PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.surojitsen.mobiletracker
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
