name: mobile_tracker
description: A small consent-based location tracker that reports to Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Battery-friendly location.
  # Pinned exactly: 12.0.0's getPositionStream uses `locationSettings`,
  # which the code relies on. Avoids resolving an incompatible API.
  geolocator: 12.0.0

  # Supabase client
  # 2.8+ handles the newer sb_publishable_ API key format correctly.
  supabase_flutter: ^2.8.0

  # Battery level for the dashboard
  battery_plus: ^6.0.2

  # Stable device id + simple local storage
  shared_preferences: ^2.2.3

  # Keeps location reporting alive when the screen is off / app is in the
  # background, by running a persistent Android foreground service. The plugin
  # creates and manages the mandatory foreground notification itself, so no
  # separate notification package is needed.
  flutter_background_service: ^5.0.5

dev_dependencies:
  flutter_lints: ^4.0.0

  # Generates the launcher icon (app icon) for all Android sizes.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# App launcher icon config. Source image: assets/icon.png (a location pin).
# Regenerate icons with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  # iOS is disabled here because the cloud build only generates the Android
  # project (flutter create --platforms=android), so the iOS icon folders
  # don't exist on the runner. When you build iOS on a Mac, set this to true
  # after running `flutter create . --platforms=ios` so the folders exist.
  ios: false
  image_path: "assets/icon.png"
  # Adaptive icon for modern Android (foreground pin on blue background).
  adaptive_icon_background: "#3B82F6"
  adaptive_icon_foreground: "assets/icon.png"
