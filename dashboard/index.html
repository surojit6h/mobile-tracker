<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile Tracker Dashboard</title>

    <!-- Leaflet (free, no API key) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Supabase JS client (pinned: new sb_publishable_ keys need a recent version) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script>

    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #app { display: flex; height: 100%; position: relative; }

      /* ---- sidebar (collapsible) ---- */
      #sidebar {
        width: 280px;
        flex: 0 0 280px;
        background: #11161c;
        color: #e6edf3;
        padding: 16px;
        overflow-y: auto;
        transition: margin-left 0.25s ease;
      }
      /* When collapsed, slide the whole sidebar off to the left. */
      #app.collapsed #sidebar {
        margin-left: -280px;
      }
      #sidebar h1 { font-size: 18px; margin: 0 0 4px; }
      #sidebar .sub { font-size: 12px; color: #8b949e; margin-bottom: 16px; }

      .device {
        background: #1b2129;
        border: 1px solid #2a313b;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .device:hover { border-color: #3b82f6; }
      .device .name { font-weight: 600; }
      .device .meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
      .device .batt { color: #3fb950; }
      .device .clear-btn {
        margin-top: 8px;
        padding: 4px 10px;
        font-size: 12px;
        color: #f0b4b4;
        background: #2a1b1b;
        border: 1px solid #4a2b2b;
        border-radius: 6px;
        cursor: pointer;
      }
      .device .clear-btn:hover {
        background: #3a2222;
        border-color: #7d2b2b;
        color: #ffd4d4;
      }

      #map { flex: 1; }
      #empty { font-size: 13px; color: #8b949e; }

      #banner {
        background: #7d2b2b; color: #fff; padding: 10px 14px;
        font-size: 13px; display: none;
      }

      /* ---- sidebar toggle button (floats over the map) ---- */
      #toggle {
        position: absolute;
        top: 12px;
        left: 12px;
        /* Above Leaflet controls (zoom/layers sit at z-index 400-1000). */
        z-index: 1200;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 8px;
        background: #11161c;
        color: #e6edf3;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: left 0.25s ease;
      }
      /* When the sidebar is open, sit the button just inside its right edge
         so it never hides behind the sidebar or the map zoom controls. */
      #app:not(.collapsed) #toggle { left: 228px; }
      #toggle:hover { background: #1b2129; }
    </style>
  </head>
  <body>
    <div id="banner"></div>
    <div id="app">
      <button id="toggle" title="Show/hide panel">☰</button>
      <div id="sidebar">
        <h1>Mobile Tracker</h1>
        <div class="sub">Live device locations · realtime</div>
        <div id="list"><div id="empty">Connecting…</div></div>
      </div>
      <div id="map"></div>
    </div>

    <!-- Your Supabase keys live here -->
    <script src="config.js"></script>

    <script>
      const cfg = window.APP_CONFIG || {};
      const banner = document.getElementById("banner");

      function warn(msg) {
        banner.textContent = msg;
        banner.style.display = "block";
      }

      // ---- sidebar toggle ----------------------------------------------
      const appEl = document.getElementById("app");
      document.getElementById("toggle").addEventListener("click", () => {
        appEl.classList.toggle("collapsed");
        // Leaflet needs to recompute size after the map area resizes.
        setTimeout(() => map.invalidateSize(), 300);
      });

      // ---- map ----------------------------------------------------------
      const map = L.map("map").setView([20, 0], 2);

      const mtKey = cfg.MAPTILER_KEY;
      const hasMapTiler = mtKey && !mtKey.includes("YOUR-");

      let streets, satellite, hybrid;

      if (hasMapTiler) {
        // MapTiler Streets: detailed, polished, Google-Maps-like road map.
        streets = L.tileLayer(
          `https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${mtKey}`,
          {
            attribution:
              '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; OpenStreetMap contributors',
            maxZoom: 20,
            tileSize: 512,
            zoomOffset: -1,
          }
        );

        // MapTiler Satellite imagery.
        satellite = L.tileLayer(
          `https://api.maptiler.com/maps/satellite/{z}/{x}/{y}.jpg?key=${mtKey}`,
          {
            attribution:
              '&copy; <a href="https://www.maptiler.com/">MapTiler</a>',
            maxZoom: 20,
            tileSize: 512,
            zoomOffset: -1,
          }
        );

        // MapTiler Hybrid: satellite imagery with road/place labels on top,
        // just like Google Maps' hybrid view (single ready-made style).
        hybrid = L.tileLayer(
          `https://api.maptiler.com/maps/hybrid/{z}/{x}/{y}.jpg?key=${mtKey}`,
          {
            attribution:
              '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; OpenStreetMap contributors',
            maxZoom: 20,
            tileSize: 512,
            zoomOffset: -1,
          }
        );
      } else {
        // Fallback (no MapTiler key): plain OpenStreetMap + Esri imagery.
        streets = L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          { attribution: "&copy; OpenStreetMap contributors", maxZoom: 19 }
        );
        satellite = L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics",
            maxZoom: 19,
          }
        );
        const labels = L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
          { attribution: "Labels &copy; Esri", maxZoom: 19 }
        );
        hybrid = L.layerGroup([satellite, labels]);
      }

      // Start on the detailed street map.
      streets.addTo(map);

      // Layer switcher in the top-right corner (Map / Satellite / Hybrid).
      L.control
        .layers(
          {
            Map: streets,
            Satellite: satellite,
            Hybrid: hybrid,
          },
          null,
          { position: "topright", collapsed: false }
        )
        .addTo(map);

      const markers = {}; // deviceId -> L.marker
      const cache = {}; // deviceId -> row
      let firstFit = true;

      // ---- travel path (trail) state -----------------------------------
      let supabaseClient = null; // set in start()
      let pathLine = null; // the drawn polyline
      let pathDots = null; // small dots at each recorded point
      let selectedDevice = null; // device_id whose path is shown
      const PATH_LIMIT = 500; // most-recent points to draw

      // Load a device's recent history and draw it as a line on the map.
      async function showPath(deviceId) {
        if (!supabaseClient) return;
        selectedDevice = deviceId;

        const { data, error } = await supabaseClient
          .from("locations")
          .select("lat,lng,recorded_at")
          .eq("device_id", deviceId)
          .order("recorded_at", { ascending: true })
          .limit(PATH_LIMIT);

        if (error) {
          warn("Could not load path: " + error.message);
          return;
        }

        const points = (data || []).map((r) => [r.lat, r.lng]);
        drawPath(points);
      }

      function drawPath(points) {
        if (pathLine) { map.removeLayer(pathLine); pathLine = null; }
        if (pathDots) { map.removeLayer(pathDots); pathDots = null; }
        if (!points.length) return;

        pathLine = L.polyline(points, {
          color: "#3b82f6",
          weight: 4,
          opacity: 0.85,
        }).addTo(map);

        // Small dots mark each individual report along the trail.
        pathDots = L.layerGroup(
          points.map((p) =>
            L.circleMarker(p, {
              radius: 3,
              color: "#1d4ed8",
              fillColor: "#60a5fa",
              fillOpacity: 1,
              weight: 1,
            })
          )
        ).addTo(map);

        map.fitBounds(pathLine.getBounds(), { padding: [50, 50], maxZoom: 17 });
      }

      // Delete all stored history for a device, then clear the drawn path.
      async function clearHistory(deviceId, deviceName) {
        if (!supabaseClient) return;
        const ok = window.confirm(
          `Delete all saved travel history for "${deviceName}"?\n` +
            "This cannot be undone. The live marker stays; only the trail is removed."
        );
        if (!ok) return;

        const { error } = await supabaseClient
          .from("locations")
          .delete()
          .eq("device_id", deviceId);

        if (error) {
          warn("Could not clear history: " + error.message);
          return;
        }

        // If this device's path is currently shown, remove it from the map.
        if (selectedDevice === deviceId) {
          drawPath([]);
          selectedDevice = null;
        }
      }

      function timeAgo(iso) {
        const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (secs < 60) return secs + "s ago";
        if (secs < 3600) return Math.floor(secs / 60) + "m ago";
        return Math.floor(secs / 3600) + "h ago";
      }

      function render() {
        const devices = Object.values(cache);
        const list = document.getElementById("list");

        if (!devices.length) {
          list.innerHTML = '<div id="empty">No devices reporting yet.</div>';
        } else {
          list.innerHTML = "";
        }

        const bounds = [];
        devices.forEach((d) => {
          const popup =
            `<b>${d.name}</b><br/>` +
            `Battery: ${d.battery == null ? "?" : d.battery + "%"}<br/>` +
            `Accuracy: ${d.accuracy == null ? "?" : Math.round(d.accuracy) + " m"}<br/>` +
            `Updated: ${timeAgo(d.updated_at)}`;

          if (markers[d.device_id]) {
            markers[d.device_id].setLatLng([d.lat, d.lng]).setPopupContent(popup);
          } else {
            markers[d.device_id] = L.marker([d.lat, d.lng])
              .addTo(map)
              .bindPopup(popup);
          }
          bounds.push([d.lat, d.lng]);

          const card = document.createElement("div");
          card.className = "device";
          card.innerHTML =
            `<div class="name">${d.name}</div>` +
            `<div class="meta">` +
            `<span class="batt">${d.battery == null ? "" : "🔋 " + d.battery + "% · "}</span>` +
            `${timeAgo(d.updated_at)}</div>` +
            `<button class="clear-btn" title="Delete this device's travel history">Clear history</button>`;

          // Clicking the card body shows the path.
          card.onclick = () => {
            markers[d.device_id].openPopup();
            showPath(d.device_id);
          };

          // Clicking the button deletes history. stopPropagation keeps it
          // from also firing the card's "show path" handler above.
          card.querySelector(".clear-btn").onclick = (e) => {
            e.stopPropagation();
            clearHistory(d.device_id, d.name);
          };

          list.appendChild(card);
        });

        if (firstFit && bounds.length) {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
          firstFit = false;
        }
      }

      // ---- Supabase -----------------------------------------------------
      async function start() {
        if (
          !cfg.SUPABASE_URL ||
          cfg.SUPABASE_URL.includes("YOUR-PROJECT") ||
          !cfg.SUPABASE_ANON_KEY ||
          cfg.SUPABASE_ANON_KEY.includes("YOUR-ANON")
        ) {
          warn("Edit config.js and add your Supabase URL + anon key.");
          document.getElementById("list").innerHTML =
            '<div id="empty">Not configured.</div>';
          return;
        }

        const supabase = window.supabase.createClient(
          cfg.SUPABASE_URL,
          cfg.SUPABASE_ANON_KEY
        );
        supabaseClient = supabase; // used by showPath()

        // Initial load.
        const { data, error } = await supabase.from("devices").select("*");
        if (error) {
          warn("Supabase error: " + error.message);
          return;
        }
        data.forEach((row) => (cache[row.device_id] = row));
        render();

        // Live updates (insert + update) to the latest-position table.
        supabase
          .channel("devices-changes")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "devices" },
            (payload) => {
              const row = payload.new;
              if (row && row.device_id) {
                cache[row.device_id] = row;
                render();
              }
            }
          )
          .subscribe();

        // Live history inserts: if the shown device reports a new point,
        // extend its drawn path in real time (no reload needed).
        supabase
          .channel("locations-changes")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "locations" },
            (payload) => {
              const row = payload.new;
              if (row && row.device_id === selectedDevice) {
                showPath(selectedDevice);
              }
            }
          )
          .subscribe();

        // Refresh the "x ago" labels every 15s even without new data.
        setInterval(render, 15000);
      }

      start();
    </script>
  </body>
</html>
